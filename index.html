<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffeff7">
<title>قهرمان کوچولو</title>
<style>
:root{--pink:#f9a8d4;--purple:#a78bfa;--mint:#bbf7d0;--yellow:#fde68a;--ink:#382b4d}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#fff0f7,#f4efff);color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.app{width:min(100%,430px);background:#ffffffed;border:2px solid #fff;border-radius:28px;padding:22px;box-shadow:0 15px 45px #8b5cf622;text-align:center}
h1{font-size:27px;margin:4px 0 8px;color:#8b5cf6}
.sub{margin:0 0 20px;color:#796a8b;font-size:14px}
.pill{display:inline-block;border-radius:999px;background:#f3e8ff;padding:8px 14px;font-size:13px;margin-bottom:14px}
.animal{font-size:94px;line-height:1.3;margin:8px auto 12px;background:#fff6fb;border-radius:24px;padding:8px;width:150px}
.question{font-size:20px;line-height:1.8;margin:8px 0 18px}
.answers{display:grid;gap:10px}
button{font:inherit;border:0;border-radius:16px;padding:14px 12px;cursor:pointer;transition:transform .12s,filter .12s}
button:active{transform:scale(.98)}
.answer:nth-child(1){background:#f9a8d4}.answer:nth-child(2){background:#bbf7d0}.answer:nth-child(3){background:#fde68a}
button:disabled{opacity:.7;cursor:default}
.feedback{min-height:30px;margin:14px 0 4px;font-weight:bold}
.stats{display:flex;justify-content:space-between;gap:8px;margin:14px 0;color:#6d5a83;font-size:14px}
.primary{background:#a78bfa;color:white;width:100%;font-weight:bold;margin-top:10px}
.secondary{background:#f3e8ff;color:#6d28d9;width:100%;margin-top:10px}
.small{font-size:12px;color:#9588a3;margin-top:15px}
.hidden{display:none}
</style>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#ffeff7"><link rel="apple-touch-icon" href="./icon-192.png"><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></head>
<body>
<main class="app">
  <div class="pill">🌈 بازی آموزشی کودکان</div>
  <h1>قهرمان کوچولو</h1>
  <p class="sub">یاد بگیر، بازی کن و ستاره جمع کن!</p>
  <section id="game">
    <div class="stats"><span id="progress">سؤال ۱ از ۵</span><span id="score">⭐ امتیاز: ۰</span></div>
    <div class="animal" id="animal" aria-label="تصویر حیوان">🐱</div>
    <div class="question" id="question">کدام حیوان می‌گوید میو؟</div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite">یک جواب را انتخاب کن 💗</div>
  </section>
  <section id="result" class="hidden">
    <div class="animal">🏆</div>
    <h2>آفرین قهرمان!</h2>
    <p id="finalScore"></p>
    <p>هر بار بازی کنی، چیز تازه‌ای یاد می‌گیری 🌟</p>
    <button class="primary" id="restart">🔄 بازی دوباره</button>
  </section>
  <p class="small">نسخهٔ اول بازی — بدون نیاز به اینترنت پس از ذخیره شدن فایل</p>
</main>
<script>
const questions = [
 {emoji:"🐱",q:"کدام حیوان می‌گوید میو؟",answers:["گربه","سگ","گاو"],correct:"گربه"},
 {emoji:"🐶",q:"کدام حیوان واق واق می‌کند؟",answers:["گربه","سگ","ماهی"],correct:"سگ"},
 {emoji:"🌱",q:"چمن معمولاً چه رنگی است؟",answers:["آبی","سبز","بنفش"],correct:"سبز"},
 {emoji:"⭐",q:"۲ + ۳ چند می‌شود؟",answers:["۴","۵","۶"],correct:"۵"},
 {emoji:"🦁",q:"کدام حیوان یال دارد؟",answers:["شیر","خرگوش","اردک"],correct:"شیر"}
];
let index=0, score=0, locked=false;
const $=id=>document.getElementById(id);
function render(){
 locked=false;
 const item=questions[index];
 $("progress").textContent=`سؤال ${index+1} از ${questions.length}`;
 $("score").textContent=`⭐ امتیاز: ${score}`;
 $("animal").textContent=item.emoji;
 $("question").textContent=item.q;
 $("feedback").textContent="یک جواب را انتخاب کن 💗";
 $("feedback").style.color="#6d5a83";
 $("answers").innerHTML="";
 item.answers.forEach(answer=>{
   const btn=document.createElement("button");
   btn.className="answer"; btn.textContent=answer;
   btn.addEventListener("click",()=>check(answer,btn));
   $("answers").appendChild(btn);
 });
}
function check(answer){
 if(locked)return; locked=true;
 const item=questions[index];
 if(answer===item.correct){score++;$("feedback").textContent="آفرین! جواب درست بود ⭐";$("feedback").style.color="#15803d"}
 else {$("feedback").textContent=`تلاش خوبی بود! جواب درست: ${item.correct} 💗`;$("feedback").style.color="#be185d"}
 $("score").textContent=`⭐ امتیاز: ${score}`;
 [...$("answers").children].forEach(btn=>btn.disabled=true);
 const next=document.createElement("button");
 next.className="primary";
 next.textContent=index===questions.length-1?"دیدن نتیجه 🏆":"سؤال بعدی ←";
 next.onclick=()=>{
   index++;
   if(index<questions.length)render();
   else showResult();
 };
 $("answers").appendChild(next);
}
function showResult(){
 $("game").classList.add("hidden");$("result").classList.remove("hidden");
 $("finalScore").textContent=`تو ${questions.length} سؤال بازی کردی و ${score} امتیاز از ${questions.length} امتیاز گرفتی!`;
}
function restart(){
 index=0;score=0;$("result").classList.add("hidden");$("game").classList.remove("hidden");render();
}
$("restart").addEventListener("click",restart);
render();
</script>
</body>
</html>
